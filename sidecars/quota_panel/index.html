<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型用量</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-main">
        <div class="title-wrap">
          <h1 class="title">模型用量</h1>
          <span id="plan-badge" class="badge badge-plan hidden"></span>
          <span id="stale-badge" class="badge badge-stale hidden" title="刷新失败，当前展示最近一次缓存数据">缓存</span>
        </div>
        <div class="topbar-actions">
          <div class="seg" role="group" aria-label="显示模式">
            <button type="button" id="mode-used" class="seg-btn active" aria-pressed="true">已用</button>
            <button type="button" id="mode-remaining" class="seg-btn" aria-pressed="false">剩余</button>
          </div>
          <button
            type="button"
            id="refresh-btn"
            class="icon-btn"
            title="立即刷新用量与账号状态"
            aria-label="立即刷新用量与账号状态"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.61" />
              <path d="M13.5 2.5v2.75h-2.75" />
            </svg>
          </button>
        </div>
      </div>
      <div id="updated-at" class="updated-at" aria-live="polite">正在获取配额信息…</div>
    </header>

    <main class="content">
      <section id="account-bar" class="account-bar" aria-label="账号管理与切换">
        <div class="account-bar-head">
          <div class="account-identity">
            <span id="account-live-dot" class="account-dot" aria-hidden="true"></span>
            <span id="active-account-label" class="account-email">检测当前账号中…</span>
            <span id="active-account-status" class="pill pill-muted hidden"></span>
          </div>
          <div class="account-bar-actions">
            <button
              type="button"
              id="save-current-btn"
              class="mini-btn"
              title="保存当前系统登录凭据快照到本地账号库"
            >保存当前</button>
            <button
              type="button"
              id="accounts-toggle-btn"
              class="mini-btn mini-btn-outline"
              aria-expanded="false"
              aria-controls="account-drawer"
            >
              <span>账号</span>
              <span id="accounts-count-badge" class="count-chip">0</span>
              <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 6l4 4 4-4" />
              </svg>
            </button>
          </div>
        </div>

        <div id="switch-status-banner" class="switch-status-banner hidden" role="status"></div>

        <div id="account-drawer" class="account-drawer hidden">
          <div class="account-toolbar">
            <button type="button" id="drawer-capture-btn" class="tool-btn">保存当前凭据</button>
            <button type="button" id="import-agy-btn" class="tool-btn">
              <span>导入 agy-switch</span>
              <span id="agy-switch-count" class="count-chip hidden"></span>
            </button>
            <button type="button" id="toggle-import-json-btn" class="tool-btn">导入 JSON</button>
            <button type="button" id="export-accounts-btn" class="tool-btn">导出备份</button>
          </div>

          <div id="import-panel" class="import-panel hidden">
            <div class="import-head">粘贴 JSON（支持本插件备份或 agy-switch 导出），或选择本地 .json 文件：</div>
            <textarea
              id="import-json-input"
              class="import-textarea"
              rows="4"
              placeholder='{"accounts":[{"email":"user@example.com","refresh_token":"1//..."}]}'
            ></textarea>
            <div class="import-actions">
              <label class="tool-btn file-label">
                选择文件
                <input type="file" id="import-file-input" accept=".json,.txt" class="sr-only">
              </label>
              <div class="import-actions-right">
                <button type="button" id="import-cancel-btn" class="tool-btn">取消</button>
                <button type="button" id="import-submit-btn" class="tool-btn tool-btn-primary">开始导入</button>
              </div>
            </div>
          </div>

          <div id="account-toast" class="account-toast hidden" role="status"></div>
          <div id="accounts-list" class="accounts-list"></div>
          <div class="account-drawer-foot">
            纯本地凭据快照：切换时写入系统凭据与 <code>agy</code> CLI 并重启 Antigravity，仓库与接口均不内置或外传密钥。
          </div>
        </div>
      </section>

      <div id="loading" class="loading" aria-busy="true" aria-live="polite">
        <div class="skel-card">
          <div class="skel skel-title"></div>
          <div class="skel skel-meta"></div>
          <div class="skel skel-bar"></div>
          <div class="skel skel-bar"></div>
        </div>
      </div>

      <div id="error-banner" class="error-banner hidden" role="alert">
        <div class="error-text" id="error-text"></div>
        <button type="button" id="retry-btn" class="retry-btn">重试</button>
      </div>

      <section id="app-view" class="app-view hidden">
        <button
          type="button"
          id="current-card"
          class="current-card"
          aria-expanded="false"
          aria-controls="all-models"
        >
          <div class="card-head">
            <div class="card-title-row">
              <span class="current-dot" aria-hidden="true"></span>
              <span id="current-model-name" class="current-model-name">--</span>
            </div>
            <div class="card-badges">
              <span id="current-source-badge" class="pill pill-muted"></span>
              <span id="current-group-badge" class="pill pill-accent"></span>
            </div>
          </div>

          <div id="current-meters" class="meters"></div>

          <div class="card-foot">
            <span id="expand-hint" class="expand-hint">点击展开全部模型用量</span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 6l4 4 4-4" />
            </svg>
          </div>
        </button>

        <section id="all-models" class="all-models hidden" aria-label="全部模型用量">
          <div id="groups-list" class="groups-list"></div>
          <footer id="quota-footer" class="quota-footer hidden"></footer>
        </section>
      </section>
    </main>
  </div>

  <div
    id="switch-confirm-modal"
    class="modal-backdrop hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="switch-modal-title"
  >
    <div class="modal-card">
      <h2 id="switch-modal-title" class="modal-title">确认切换账号并重启？</h2>
      <p id="switch-modal-desc" class="modal-desc"></p>
      <div class="modal-warn">
        切换将关闭并重新启动 Antigravity（同步更新原生 <code>agy</code> CLI 登录态）；正在进行中的任务不会迁移。
      </div>
      <div class="modal-actions">
        <button type="button" id="switch-cancel-btn" class="tool-btn">取消</button>
        <button type="button" id="switch-confirm-btn" class="tool-btn tool-btn-primary">确认切换并重启</button>
      </div>
    </div>
  </div>
</body>
</html>
